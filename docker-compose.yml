services:
  prod:
    build:
      context: ./
      dockerfile: prod.Dockerfile
    container_name: prod
    restart: always
    privileged: true
    logging:
      options:
        max-size: 20m
    volumes:
      - /home/kioVisitsWebcam/dev_persistent_storage:/home/pi/Desktop

    devices:
      - /dev/video0:/dev/video0
      - /dev/ttyUSB0:/dev/ttyUSB0
      - /dev/ttyUSB1:/dev/ttyUSB1
    env_file:
      - /home/kioVisitsWebcam/prod.env

    command: python3 main.py

